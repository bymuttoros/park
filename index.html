<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cafe Park TV</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}#tv{position:relative;width:100vw;height:100vh}.slide{position:absolute;inset:0;opacity:0;transition:opacity .9s ease}.slide.active{opacity:1}.slide img{width:100%;height:100%;object-fit:cover}.logo{position:absolute;z-index:5;left:2vw;top:2vh;width:9vw;height:9vw;max-width:170px;max-height:170px;min-width:90px;min-height:90px;border-radius:50%;overflow:hidden;border:2px solid #d8ad54;background:#fff}.logo img{width:100%;height:100%;object-fit:cover}.clock{position:absolute;z-index:5;right:2vw;top:2vh;min-width:17vw;padding:1vh 1.2vw;border:1px solid #d8ad54;border-radius:14px;background:rgba(3,15,11,.82);color:#fff;text-align:center}.time{font-size:5.7vh;font-weight:900}.date{font-size:1.9vh;color:#f1cf86;font-weight:800;margin-top:.6vh}.day{font-size:1.65vh;font-weight:700;margin-top:.3vh}.brand{position:absolute;z-index:5;left:50%;bottom:1.5vh;transform:translateX(-50%);padding:.65vh 1.2vw;border-radius:999px;border:1px solid rgba(216,173,84,.7);background:rgba(3,15,11,.72);color:#fff;font-size:1.45vh;font-weight:800;white-space:nowrap}.brand b{color:#f1ca75}.progress{position:absolute;z-index:6;left:0;right:0;bottom:0;height:.55vh;background:rgba(255,255,255,.12)}.progress span{display:block;height:100%;width:0;background:#d8ad54}</style></head>
<body><div id="tv"><div id="slides"></div><div class="logo"><img src="logo.jpg"></div><div class="clock"><div class="time" id="clock">--:--</div><div class="date" id="date"></div><div class="day" id="day"></div></div><div class="brand"><b>CAFE PARK HASSA</b> • 15 Kasım Parkı • @cafeparkhassa</div><div class="progress"><span id="bar"></span></div></div>
<script src="slides.js"></script><script>
const images=window.CAFE_PARK_SLIDES||[],I=7000,s=document.getElementById("slides"),b=document.getElementById("bar");let n=0,t;
s.innerHTML=images.map((x,i)=>`<div class="slide ${i===0?'active':''}"><img src="${x}"></div>`).join("");
function show(){document.querySelectorAll(".slide").forEach((e,i)=>e.classList.toggle("active",i===n));b.style.transition="none";b.style.width="0";requestAnimationFrame(()=>requestAnimationFrame(()=>{b.style.transition=`width ${I}ms linear`;b.style.width="100%"}))}
function start(){clearInterval(t);show();t=setInterval(()=>{n=(n+1)%images.length;show()},I)}start();
function tick(){const d=new Date();clock.textContent=d.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"});date.textContent=d.toLocaleDateString("tr-TR",{day:"2-digit",month:"long",year:"numeric"});day.textContent=d.toLocaleDateString("tr-TR",{weekday:"long"})}tick();setInterval(tick,1000);
</script></body></html>
