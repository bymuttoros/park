<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b09">
<title>Cafe Park Hassa • TV</title>
<style>
:root{
  --gold:#d8ad54;
  --ink:#06110d;
  --glass:rgba(5,15,12,.78);
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;
  overflow:hidden;background:#000;
  font-family:Arial,Helvetica,sans-serif;
}
body{user-select:none}
#tv{position:relative;width:100vw;height:100vh;background:#000;overflow:hidden}
.slide{
  position:absolute;inset:0;
  opacity:0;transform:scale(1.012);
  transition:opacity 900ms ease,transform 6.8s linear;
}
.slide.active{opacity:1;transform:scale(1)}
.slide img{
  width:100%;height:100%;display:block;
  object-fit:cover;
}
.vignette{
  pointer-events:none;position:absolute;inset:0;z-index:2;
  background:
    linear-gradient(180deg,rgba(0,0,0,.32) 0%,transparent 20%,transparent 76%,rgba(0,0,0,.38) 100%),
    linear-gradient(90deg,rgba(0,0,0,.18),transparent 18%,transparent 82%,rgba(0,0,0,.18));
}
.logoBox{
  position:absolute;z-index:5;top:2.2vh;left:2vw;
  width:9.6vw;height:9.6vw;max-width:178px;max-height:178px;
  min-width:96px;min-height:96px;border-radius:50%;
  overflow:hidden;background:#fff;
  border:2px solid rgba(216,173,84,.95);
  box-shadow:0 12px 34px rgba(0,0,0,.38);
}
.logoBox img{width:100%;height:100%;object-fit:cover}
.clockBox{
  position:absolute;z-index:5;right:2vw;top:2.2vh;
  min-width:17vw;padding:1.25vh 1.25vw 1.1vh;
  color:white;text-align:center;
  background:linear-gradient(180deg,rgba(4,18,14,.88),rgba(2,10,8,.78));
  border:1px solid rgba(216,173,84,.8);
  border-radius:1.3vh;
  box-shadow:0 12px 34px rgba(0,0,0,.34);
  backdrop-filter:blur(8px);
}
.time{font-size:5.8vh;line-height:1;font-weight:900;letter-spacing:.02em}
.date{margin-top:.65vh;font-size:1.95vh;font-weight:800;color:#f2d18c}
.day{margin-top:.28vh;font-size:1.65vh;font-weight:700;color:#fff}
.brandStrip{
  position:absolute;z-index:5;left:50%;bottom:1.7vh;transform:translateX(-50%);
  display:flex;align-items:center;gap:1.1vw;
  padding:.7vh 1.2vw;
  border:1px solid rgba(216,173,84,.72);
  border-radius:999px;
  background:rgba(4,14,11,.72);
  color:#fff;backdrop-filter:blur(7px);
  font-weight:800;font-size:1.5vh;letter-spacing:.08em;
  box-shadow:0 8px 26px rgba(0,0,0,.25);
}
.brandStrip b{color:#f2ca72}
.progress{
  position:absolute;z-index:6;left:0;right:0;bottom:0;height:.55vh;
  background:rgba(255,255,255,.12);
}
.progress span{display:block;width:0;height:100%;background:linear-gradient(90deg,#fff0b0,var(--gold))}
.dots{
  position:absolute;z-index:6;right:2vw;bottom:2.1vh;
  display:flex;gap:.38vw;
}
.dot{width:.46vw;height:.46vw;min-width:7px;min-height:7px;border-radius:50%;background:rgba(255,255,255,.34)}
.dot.active{background:#f4ce78;box-shadow:0 0 0 2px rgba(244,206,120,.16)}
@media(max-aspect-ratio:4/3){
  .clockBox{min-width:28vw}
  .brandStrip{font-size:1.3vh}
}
</style>
</head>
<body>
<div id="tv">
  <div id="slides"></div>
  <div class="vignette"></div>

  <div class="logoBox"><img src="assets/logo.jpg" alt="Cafe Park Hassa"></div>

  <div class="clockBox">
    <div class="time" id="clock">--:--</div>
    <div class="date" id="date">--</div>
    <div class="day" id="day">--</div>
  </div>

  <div class="brandStrip"><b>CAFE PARK HASSA</b><span>•</span><span>15 Kasım Parkı</span><span>•</span><span>@cafeparkhassa</span></div>

  <div class="dots" id="dots"></div>
  <div class="progress"><span id="bar"></span></div>
</div>

<script>
const images = [
  "assets/slide01.jpg",
  "assets/slide02.jpg",
  "assets/slide03.jpg",
  "assets/slide04.jpg",
  "assets/slide05.jpg",
  "assets/slide06.jpg",
  "assets/slide07.jpg",
  "assets/slide08.jpg",
  "assets/slide09.jpg"
];

const INTERVAL = 7000;
let index = 0;
let timer;

const slidesEl = document.getElementById("slides");
const dotsEl = document.getElementById("dots");
const bar = document.getElementById("bar");

slidesEl.innerHTML = images.map((src,i)=>
  `<div class="slide ${i===0?'active':''}"><img src="${src}" alt="Cafe Park tanıtım ${i+1}"></div>`
).join("");

dotsEl.innerHTML = images.map((_,i)=>`<span class="dot ${i===0?'active':''}"></span>`).join("");

function animateBar(){
  bar.style.transition="none";
  bar.style.width="0";
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    bar.style.transition=`width ${INTERVAL}ms linear`;
    bar.style.width="100%";
  }));
}

function show(n){
  document.querySelectorAll(".slide").forEach((el,i)=>el.classList.toggle("active",i===n));
  document.querySelectorAll(".dot").forEach((el,i)=>el.classList.toggle("active",i===n));
  animateBar();
}

function start(){
  clearInterval(timer);
  show(index);
  timer=setInterval(()=>{
    index=(index+1)%images.length;
    show(index);
  },INTERVAL);
}

function tick(){
  const d=new Date();
  document.getElementById("clock").textContent=d.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"});
  document.getElementById("date").textContent=d.toLocaleDateString("tr-TR",{day:"2-digit",month:"long",year:"numeric"});
  document.getElementById("day").textContent=d.toLocaleDateString("tr-TR",{weekday:"long"});
}
tick();
setInterval(tick,1000);

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"){index=(index+1)%images.length;start()}
  if(e.key==="ArrowLeft"){index=(index-1+images.length)%images.length;start()}
  if(e.key.toLowerCase()==="f" && !document.fullscreenElement){
    document.documentElement.requestFullscreen().catch(()=>{});
  }
});
document.addEventListener("dblclick",()=>{
  if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
});

start();

// TV tarayıcısı uzun süre açık kalırsa sayfayı günde birkaç kez tazeler.
setTimeout(()=>location.reload(), 6*60*60*1000);
</script>
</body>
</html>
